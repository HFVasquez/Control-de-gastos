<style>

/* CONTROL FINANCIERO - interfaz ejecutiva responsive */
:root{--bg:#f2f3f5;--ink:#202328;--mut:#71767d;--card:#fff;--line:#e1e4e8;--in:#247258;--out:#ad1f2d;--acc:#ad1f2d;--warn:#a66b16;--graphite:#202328;--soft:#f7f7f8}
body{background:linear-gradient(135deg,#eef0f2 0%,#f8f8f9 75%);color:var(--ink);padding:0 0 60px 238px;min-height:100vh}
main{max-width:1180px;margin:0 auto;padding:36px 34px 110px}
main:before{content:"CONTROL FINANCIERO";display:block;color:var(--acc);font-size:12px;font-weight:800;letter-spacing:.18em;margin:0 0 15px}
h1{font-size:16px;color:var(--mut);margin:0 0 14px}h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:#4f545a;margin:28px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:15px;box-shadow:0 8px 24px rgba(29,33,38,.055)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1f2226 0%,#30343a 72%,#48171e 100%);border-radius:14px;padding:30px 28px;margin-bottom:15px;box-shadow:0 18px 38px rgba(22,25,29,.18);border-left:5px solid var(--acc)}
.hero:after{content:"";position:absolute;right:-70px;bottom:-100px;width:260px;height:260px;transform:rotate(45deg);background:linear-gradient(135deg,transparent 35%,rgba(190,31,45,.25) 35%,rgba(190,31,45,.25) 48%,transparent 48%,transparent 58%,rgba(190,31,45,.13) 58%,rgba(190,31,45,.13) 72%,transparent 72%)}
.hero small{color:#c9cdd2;text-transform:uppercase;letter-spacing:.08em}.big{font-size:48px;font-weight:800}.tip{border-color:#4b5057;position:relative;z-index:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);background:transparent;gap:15px;margin-bottom:15px}.tiles div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 7px 20px rgba(31,35,40,.05)}.tiles div:last-child{border:1px solid var(--line)}.tiles small{text-transform:uppercase;font-size:11px;letter-spacing:.07em}.tiles b{font-size:21px}
.row{padding:14px 8px;border-color:#eceef0}.row:hover{background:#fafafa}.amt{font-weight:800}.out{color:var(--out)}
.al{border-radius:9px;border:1px solid transparent}.al.bad{background:#fff1f2;border-color:#f0c6ca;color:#951d28}.al.warn{background:#fff8e9;border-color:#eedfbd}
.btn{border-radius:7px;background:linear-gradient(135deg,#bd2b39,#991a27);box-shadow:0 7px 16px rgba(151,24,36,.16);font-weight:700}.btn:hover{transform:translateY(-1px);filter:brightness(.97)}.btn.g{background:#eef0f2;color:#30343a;border:1px solid #dadddf;box-shadow:none}.btn.r{background:#fff;color:#a31e2b;border:1px solid #e5b8bd;box-shadow:none}
input,select{border-radius:8px;background:#fbfbfc;border:1px solid #d8dce0;padding:12px;outline:none}input:focus,select:focus{background:#fff;border-color:var(--acc);box-shadow:0 0 0 3px rgba(173,31,45,.1)}
nav{position:fixed;left:0;top:0;bottom:0;width:238px;right:auto;height:auto;background:linear-gradient(180deg,#202328,#282c31);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:96px 18px 20px;border:0;box-shadow:10px 0 28px rgba(22,25,29,.08);z-index:10}
nav:before{content:"CONTROL\A FINANCIERO";white-space:pre;position:absolute;left:28px;top:28px;color:#fff;font-size:17px;font-weight:800;line-height:1.05;letter-spacing:.04em;border-left:6px solid var(--acc);padding-left:13px}
nav button{max-width:none;flex:0 0 auto;text-align:left;padding:14px 16px;margin:3px 0;border-radius:8px;color:#c9ccd0;font-size:14px;font-weight:600}nav button:hover{background:#30343a;color:#fff}nav button.on{color:#fff;background:linear-gradient(90deg,#8f1723,#b62332);box-shadow:0 7px 18px rgba(122,18,28,.28)}
.fab{right:30px;bottom:28px;border-radius:8px;padding:14px 24px;background:linear-gradient(135deg,#c12c3b,#9a1926);box-shadow:0 12px 28px rgba(145,22,34,.28);font-weight:800}
dialog{border-radius:14px;border:1px solid var(--line);box-shadow:0 25px 70px rgba(20,24,29,.3)}dialog::backdrop{background:rgba(22,25,29,.66);backdrop-filter:blur(3px)}
.bar i{background:linear-gradient(90deg,#34383e,#ad1f2d);border-radius:3px}.date-picks{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.date-picks label{margin:0;display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:#fafafa;cursor:pointer}.date-picks input{width:auto;accent-color:var(--acc)}
@media(min-width:900px){#app>.hero{width:55%;display:inline-block;vertical-align:top;margin-right:14px}#app>.hero+.tiles{width:calc(45% - 19px);display:inline-grid;vertical-align:top;grid-template-columns:1fr;height:auto}#app>.hero+.tiles div{padding:14px 18px}.card{overflow:hidden}}
@media(max-width:760px){body{padding:0 0 105px;background:#f3f4f5}main{padding:22px 14px 125px}main:before{margin-top:2px}.hero{padding:25px 20px}.big{font-size:39px}.card{padding:16px;border-radius:11px}.tiles{grid-template-columns:1fr 1fr;gap:10px}.tiles div{padding:14px}.tiles div:last-child{grid-column:1/-1}.tiles b{font-size:18px}nav{left:0;right:0;top:auto;bottom:0;width:auto;height:70px;flex-direction:row;padding:0 5px env(safe-area-inset-bottom);align-items:stretch;justify-content:center;background:#24272c;box-shadow:0 -8px 24px rgba(20,23,27,.14)}nav:before{display:none}nav button{flex:1;max-width:none;text-align:center;padding:7px 2px;margin:0;border-radius:0;font-size:11px;display:flex;align-items:center;justify-content:center}nav button.on{box-shadow:inset 0 3px 0 #d03342;background:#30343a}.fab{right:14px;bottom:82px;padding:13px 18px}.prow{grid-template-columns:1fr 72px 90px 34px}.row{gap:6px}}

</style>

<body>
<main id="app"></main>
<button class="fab" onclick="openTx()">+ Agregar</button>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="lock" hidden><form onsubmit="event.preventDefault();unlock()"><div style="font-size:30px;font-weight:800">Mis finanzas</div><p style="color:var(--mut)">Inicia sesión para continuar</p>
<input id="lu" placeholder="Usuario" autocomplete="username" autocapitalize="none"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" style="margin-top:10px">
<p id="le" style="color:var(--out);font-weight:600;min-height:22px"></p><button class="btn" style="width:100%">Entrar</button></form></div>
<script>
const CATS=['Almuerzo','Comida','Gasolina','Transporte','Servicios','Deudas','Hijos','Hogar','Salud','Otros'];
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=n=>'L '+(+n).toLocaleString('es-HN',{maximumFractionDigits:2});
const iso=d=>{d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const shift=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const sum=a=>a.reduce((s,x)=>s+(x.amt||0),0);
let ENC=false,LK=null;try{ENC=!!localStorage.getItem('fin_enc')}catch(x){}
let S=(()=>{if(ENC)return{tx:[],cards:[],set:{min:500,payday:13},fixed:[]};try{const s=JSON.parse(localStorage.getItem('fin'));if(s&&s.tx)return s}catch(x){}return{tx:[],cards:[],set:{min:500,payday:13}}})();
S.fixed=S.fixed||[];
const te=new TextEncoder(),b64=u=>{let t='';for(const x of new Uint8Array(u))t+=String.fromCharCode(x);return btoa(t)},ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function dkey(u,p,salt){const m=await crypto.subtle.importKey('raw',te.encode(u.trim().toLowerCase()+':'+p),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(j,k){const iv=crypto.getRandomValues(new Uint8Array(12));
 return JSON.stringify({s:b64(k.salt),i:b64(iv),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},k.key,te.encode(j)))})}
let Q=Promise.resolve();
const save=()=>{try{if(ENC){if(!LK)return;const j=JSON.stringify(S),k=LK;Q=Q.then(async()=>localStorage.setItem('fin_enc',await seal(j,k))).catch(()=>{})}
 else localStorage.setItem('fin',JSON.stringify(S))}catch(x){}};
async function unlock(){const er=$('#le');er.textContent='';
 try{const o=JSON.parse(localStorage.getItem('fin_enc')),salt=ub(o.s),key=await dkey($('#lu').value,$('#lp').value,salt),
  pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},key,ub(o.d));
  S=JSON.parse(new TextDecoder().decode(pt));S.fixed=S.fixed||[];LK={key,salt,u:$('#lu').value.trim()};
  $('#lock').hidden=true;$('#lp').value='';FD.src=defSrc();tab='res';render();notify()}
 catch(x){er.textContent='Usuario o contraseña incorrectos.'}}
function lockNow(){if(!ENC||!LK)return;LK=null;S={tx:[],cards:[],set:{min:500,payday:13},fixed:[]};
 $('#dlg').close();$('#app').innerHTML='';$('#lock').hidden=false;$('#lu').value='';$('#lu').focus()}
let hid=0;document.addEventListener('visibilitychange',()=>{if(!ENC||!LK)return;if(document.hidden)hid=Date.now();else if(Date.now()-hid>60000)lockNow()});
async function verify(pw){try{const o=JSON.parse(localStorage.getItem('fin_enc'));
 await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},await dkey(LK.u,pw,ub(o.s)),ub(o.d));return true}catch(x){return false}}
async function setLock(change){
 if(!(window.crypto&&crypto.subtle))return alert('Este navegador solo permite cifrar en páginas https (como GitHub Pages).');
 if(change&&!await verify($('#sc').value))return alert('La contraseña actual es incorrecta.');
 const u=$('#su').value.trim(),p=$('#sp').value;
 if(u.length<3||p.length<6)return alert('Usuario de mínimo 3 caracteres y contraseña de mínimo 6.');
 if(p!=$('#sp2').value)return alert('Las contraseñas no coinciden.');
 await Q;const salt=crypto.getRandomValues(new Uint8Array(16)),key=await dkey(u,p,salt);LK={key,salt,u};ENC=true;
 localStorage.setItem('fin_enc',await seal(JSON.stringify(S),LK));localStorage.removeItem('fin');render();
 alert(change?'Usuario y contraseña actualizados.':'Protección activada. Desde ahora la app te pedirá usuario y contraseña.')}
async function unsetLock(){if(!await verify($('#sc').value))return alert('La contraseña actual es incorrecta.');
 if(!confirm('¿Quitar la protección? Tus datos quedarán sin cifrar en este celular.'))return;
 await Q;localStorage.setItem('fin',JSON.stringify(S));localStorage.removeItem('fin_enc');ENC=false;LK=null;render()}
let tab='res',M=today().slice(0,7),D=null,F='';
const card=id=>S.cards.find(c=>c.id==id);
const cname=c=>c.bank+' ••'+c.last4;
const srcName=s=>s=='efectivo'?'Efectivo':s=='cuenta'?'Sin tarjeta asignada':card(s)?cname(card(s)):'Tarjeta eliminada';
const psum=t=>(t.parts||[]).reduce((s,p)=>s+(+p.a||0),0);
const isCred=id=>{const c=card(id);return c&&c.kind=='credito'};
const byDate=(a,b)=>b.date.localeCompare(a.date)||b.id-a.id;

function calc(tx=S.tx){const bal={},dbt={};let cash=0;
 const A=(o,k,v)=>o[k]=(o[k]||0)+v,T=o=>Object.values(o).reduce((a,b)=>a+b,0);
 tx.forEach(t=>{const s=t.src||'cuenta';
  if(t.type=='in'||t.type=='adj'){if(s=='efectivo')cash+=t.amt;else A(bal,s,t.amt)}
  else if(t.type=='wd'){A(bal,s,-t.amt);cash+=t.amt-psum(t)}
  else if(t.type=='tr'){A(bal,s,-t.amt);isCred(t.to)?A(dbt,t.to,-t.amt):A(bal,t.to,t.amt)}
  else if(s=='efectivo')cash-=t.amt;
  else if(isCred(s))A(dbt,s,t.amt);
  else A(bal,s,-t.amt)});
 return{bank:T(bal),cash,debt:T(dbt),bal,dbt}}

function spends(){const r=[];
 S.tx.forEach(t=>{
  if(t.type=='out')r.push({date:t.date,amt:t.amt,desc:t.desc,cat:t.cat,src:srcName(t.src)});
  if(t.type=='wd')(t.parts||[]).forEach(p=>r.push({date:t.date,amt:+p.a,desc:p.d,cat:p.c,src:'Efectivo (retiro)'}))});
 return r}

function budget(){
 const k=calc(),avail=k.bank+k.cash,sp=spends(),td=today(),spentT=sum(sp.filter(x=>x.date==td)),
 p=+S.set.payday||13,n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),
 nx=new Date(n.getFullYear(),n.getMonth()+(n.getDate()<p?0:1),p),
 days=Math.max(1,Math.round((nx-t0)/864e5)),rsv=reserved(nx),free=avail-rsv,
 base=Math.max(0,free+spentT)/days,left=base-spentT,
 w7=sum(sp.filter(x=>x.date>=shift(-6)&&x.date<=td))/7,
 lun=sp.filter(x=>x.cat=='Almuerzo'),avg=lun.length?sum(lun)/lun.length:0;
 let msg;
 if(free<0)msg='Tus pagos fijos hasta tu sueldo ('+L(rsv)+') superan lo que tienes ('+L(avail)+') por '+L(-free)+'. Prioriza esos pagos y gasta lo mínimo en comida.';
 else{msg='Hasta tu pago (en '+days+(days>1?' días':' día')+') puedes gastar '+L(base)+' al día'+(rsv>0?', ya apartando '+L(rsv)+' de pagos fijos':'')+'. '+(left>=0?'Hoy te quedan '+L(left)+'.':'Hoy ya te pasaste por '+L(-left)+'.');
  if(!avg)msg+=' Registra algunos almuerzos y te diré cuánto conviene gastar en el trabajo.';
  else if(left<=0)msg+=' Si puedes, lleva almuerzo de casa.';
  else if(avg>left*.4)msg+=' Tu almuerzo en el trabajo promedia '+L(avg)+': busca uno de máximo '+L(left*.35)+'.';
  else msg+=' Tu almuerzo promedio ('+L(avg)+') cabe en lo de hoy.'}
 return{k,avail,w7,days,free,msg}}

function vRes(){
 const b=budget(),k=b.k,al=[],row=([n,v,c,sub])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #2F4361"><span>${e(n)}${sub?`<small>${sub}</small>`:''}</span><b class="${v<0&&!c?'neg':''}" style="${c?'font-weight:600;color:#B9C5D6':''}">${L(v)}</b></div>`,mo=today().slice(0,7),spBy=id=>L(sum(S.tx.filter(t=>t.type=='out'&&(t.src||'cuenta')==id&&t.date.startsWith(mo))));
 if(b.avail<=S.set.min)al.push(['bad','Te queda poco: '+L(b.avail)+', por debajo de tu alerta de '+L(S.set.min)+'.']);
 if(b.w7>0&&b.free>0&&b.free/b.w7<b.days)al.push(['warn','Al ritmo de los últimos 7 días ('+L(b.w7)+' al día), tu dinero libre alcanza para '+Math.floor(b.free/b.w7)+' días y faltan '+b.days+' para tu pago.']);
 const rows=S.cards.filter(c=>c.kind=='debito').map(c=>[cname(c),k.bal[c.id]||0,0,'Gastado este mes: '+spBy(c.id)]);
 if(k.bal.cuenta||!rows.length)rows.push(['Sin tarjeta asignada',k.bal.cuenta||0]);
 rows.push(['Efectivo',k.cash,0,'Gastado este mes: '+L(sum(spends().filter(x=>x.src.startsWith('Efectivo')&&x.date.startsWith(mo))))]);
 const cr=S.cards.filter(c=>c.kind=='credito').map(c=>[cname(c)+' · debes',k.dbt[c.id]||0,1,'Compras este mes: '+spBy(c.id)]);
 return`<div class="hero"><small>Saldo total disponible</small><div class="big ${b.avail<0?'neg':''}">${L(b.avail)}</div>${rows.map(row).join('')}${cr.map(row).join('')}</div>`+
 remind()+al.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join('')+
 `<div class="card"><b>Aviso de hoy</b><p style="margin:6px 0 0">${b.msg}</p></div>
 <h2>Últimos movimientos</h2><div class="card">${list([...S.tx].sort(byDate).slice(0,6))}</div>`}

function list(tx){
 if(!tx.length)return'<div class="empty">Aún no hay movimientos. Toca “+ Agregar”.</div>';
 let h='',last='';
 tx.forEach(t=>{
  if(t.date!=last){last=t.date;h+=`<div class="day">${new Date(t.date+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'})}</div>`}
  const wd=t.type=='wd',rest=wd?t.amt-psum(t):0;
  h+=`<div class="row" onclick="${t.type=='adj'?`delAdj(${t.id})`:`openTx(${t.id})`}"><div>${e(t.desc||t.cat)}<small>${t.type=='adj'?e(srcName(t.src)):wd?(e(srcName(t.src))+' · '+t.parts.length+' gastos detallados'+(rest>0?' · sin detallar '+L(rest):'')):t.type=='in'?(t.src=='efectivo'?'Ingreso en efectivo':'Abono a '+e(srcName(t.src||'cuenta'))):t.type=='tr'?e(srcName(t.src))+' → '+e(srcName(t.to)):e(t.cat)+' · '+e(srcName(t.src))}</small></div>

function nstat(){if(typeof Notification=='undefined')return'Este navegador no permite avisos. Los recordatorios los verás dentro de la app.';
 const p=Notification.permission;return p=='granted'?'Activados ✓ (te avisan al abrir la app)':p=='denied'?'Bloqueados. Actívalos en los permisos del sitio, en la configuración de tu navegador.':'Sin activar.'}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.tx)throw 0;S=s;save();render()}catch(x){alert('Archivo no válido')}};r.readAsText(f)}

function openTx(id){const t=S.tx.find(x=>x.id==id);
 D=t?JSON.parse(JSON.stringify(t)):{id:Date.now(),type:'out',date:today(),amt:'',desc:'',cat:'Almuerzo',src:'efectivo',parts:[]};
 D.isNew=!t;if(D.type=='in'&&!D.src)D.src='cuenta';mdl();$('#dlg').showModal()}
const accts=k=>{const o=[];if(k=='out')o.push(['efectivo','Efectivo']);
 S.cards.filter(c=>c.kind=='debito').forEach(c=>o.push([c.id,cname(c)]));o.push(['cuenta','Sin tarjeta asignada']);
 if(k=='inc')o.push(['efectivo','Efectivo']);
 if(k=='out'||k=='to')S.cards.filter(c=>c.kind=='credito').forEach(c=>o.push([c.id,cname(c)+' (crédito)']));return o};
const sel=(o,v,fn)=>`<select onchange="${fn}">${o.map(([i,n])=>`<option value="${i}" ${v==i?'selected':''}>${e(n)}</option>`).join('')}</select>`;
function setType(t){D.type=t;const o=accts(t=='out'?'out':t=='in'?'inc':'in').map(x=>String(x[0]));if(!o.includes(String(D.src))||(t=='in'&&D.src=='efectivo'))D.src=o.find(x=>x!='efectivo');
 if(t=='tr'){const to=accts('to').map(x=>String(x[0])).filter(x=>x!=D.src);if(!to.includes(String(D.to)))D.to=to[0]||''}mdl()}
const catOpts=v=>CATS.map(c=>`<option ${c==v?'selected':''}>${c}</option>`).join('');
function rest(){const r=$('#rest');if(r)r.textContent=L((+D.amt||0)-psum(D))}
function mdl(){
 const T=[['out','Gasto'],['in','Ingreso'],['wd','Retiro'],['tr','Transferir']],t=D.type,
 bal=t=='tr'?(calc(S.tx.filter(x=>x.id!=D.id)).bal[D.src]||0):0,
 lab={out:'Pagado con',in:'Abonado a',wd:'Retirado de',tr:'De'}[t];
 $('#dlg').innerHTML=`<div class="seg">${T.map(([v,n])=>`<button class="btn ${t==v?'':'g'}" onclick="setType('${v}')">${n}</button>`).join('')}</div>
 <label>Fecha</label><div style="display:flex;gap:6px"><input type="date" value="${D.date}" onchange="D.date=this.value">
 <button class="btn g" onclick="D.date=today();mdl()">Hoy</button><button class="btn g" onclick="D.date=shift(-1);mdl()">Ayer</button></div>
 <label>Monto (L)</label><input type="number" inputmode="decimal" value="${D.amt}" oninput="D.amt=this.value;rest()">
 <label>Descripción</label><input value="${e(D.desc)}" oninput="D.desc=this.value" placeholder="${t=='wd'?'Retiro de efectivo':t=='tr'?'Transferencia':'Ej. Almuerzo'}">
 ${t=='out'?`<label>Categoría</label><select onchange="D.cat=this.value">${catOpts(D.cat)}</select>`:''}
 <label>${lab}</label>${sel(accts(t=='out'?'out':t=='in'?'inc':'in'),D.src,t=='tr'?"D.src=this.value;setType('tr')":'D.src=this.value')}
 ${t=='tr'?`<p style="margin:6px 0 0;color:var(--mut)">Saldo disponible: <b>${L(bal)}</b> <button class="btn g" style="padding:4px 10px;font-size:13px" onclick="D.amt=${Math.max(0,bal)};mdl()">Transferir todo</button></p>
 <label>A</label>${sel(accts('to').filter(x=>x[0]!=D.src),D.to,'D.to=this.value;mdl()')}
 ${isCred(D.to)?'<p style="margin:6px 0 0;color:var(--mut)">Esto se registra como pago de la deuda de esa tarjeta.</p>':''}`:''}
 ${t=='wd'?`<label>¿En qué se gastó este efectivo?</label>${D.parts.map((p,i)=>`<div class="prow"><input placeholder="¿En qué?" value="${e(p.d)}" oninput="D.parts[${i}].d=this.value"><input type="number" inputmode="decimal" placeholder="L" value="${p.a||''}" oninput="D.parts[${i}].a=+this.value;rest()"><select onchange="D.parts[${i}].c=this.value">${catOpts(p.c)}</select><button class="btn r" onclick="D.parts.splice(${i},1);mdl()">×</button></div>`).join('')}
 <div class="gap"><button class="btn g" onclick="D.parts.push({d:'',a:0,c:'Otros'});mdl()">+ Agregar gasto del retiro</button></div>
 <p style="margin:10px 0 0">Sin detallar: <b id="rest">${L((+D.amt||0)-psum(D))}</b></p>`:''}
 <div class="gap"><button class="btn g" onclick="$('#dlg').close()">Cancelar</button>${D.isNew?'':'<button class="btn r" onclick="delTx()">Eliminar</button>'}<button class="btn" onclick="saveTx()">Guardar</button></div>`}
function saveTx(){
 D.amt=+D.amt;if(!(D.amt>0))return alert('Escribe un monto mayor a 0.');if(!D.date)return alert('Elige una fecha.');
 if(D.type=='tr'){if(!D.to||D.to==D.src)return alert('Elige una tarjeta de destino distinta.');D.desc=D.desc||'Transferencia'}else delete D.to;
 if(D.type=='wd'){D.parts=D.parts.filter(p=>p.a>0);if(psum(D)>D.amt)return alert('El desglose supera el monto del retiro.');D.desc=D.desc||'Retiro de efectivo'}
 else delete D.parts;
 if(D.type=='in')D.desc=D.desc||'Ingreso';
 if(D.type!='out')delete D.fixed;
 if(D.type=='tr'||D.type=='wd'){const bl=calc(S.tx.filter(x=>x.id!=D.id)).bal[D.src]||0;if(D.amt>bl+.005&&!confirm('Según la app esa tarjeta solo tiene '+L(bl)+' y vas a sacar '+L(D.amt)+'. Si falta registrar un ingreso, cancela y regístralo primero. ¿Guardar igual?'))return}
 delete D.isNew;const i=S.tx.findIndex(x=>x.id==D.id);i<0?S.tx.push(D):S.tx[i]=D;
 save();$('#dlg').close();M=D.date.slice(0,7);render()}
function delTx(){if(confirm('¿Eliminar este movimiento?')){S.tx=S.tx.filter(x=>x.id!=D.id);save();$('#dlg').close();render()}}

function render(){
 S.fixed=S.fixed||[];$('#app').innerHTML={res:vRes,mov:vMov,fij:vFix,tar:vCards,rep:vRep,aju:vSet}[tab]();
 $('#nav').innerHTML=[['res','Resumen'],['mov','Movimientos'],['fij','Gastos fijos'],['tar','Cuentas'],['rep','Reportes'],['aju','Ajustes']]
  .map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${n}</button>`).join('')}
if(ENC){$('#lock').hidden=false;$('#lu').focus()}else{render();notify()}
</script>
</body>
</html>
